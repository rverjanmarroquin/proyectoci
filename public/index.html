<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurante La Mesa - Reservas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Restaurante La Mesa</h1>
    <p class="sub">Reserva tu mesa en linea</p>

    <form id="form-reserva">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required minlength="2" maxlength="80">

      <label for="email">Correo electronico</label>
      <input id="email" name="email" type="email" required>

      <div class="fila">
        <div><label for="fecha">Fecha</label><input id="fecha" name="fecha" type="date" required></div>
        <div><label for="hora">Hora</label><select id="hora" name="hora" required></select></div>
        <div><label for="personas">Personas</label><input id="personas" name="personas" type="number" min="1" max="10" value="2" required></div>
      </div>

      <button id="reservar" type="submit">Reservar</button>
      <p id="mensaje" role="status"></p>
    </form>

    <h2>Ultimas reservas</h2>
    <ul id="lista"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
